<!DOCTYPE html>
<html>
<head>
<title>Advanced Crop Health Dashboard</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background:#e8f0f2;
    margin:0;
}

header{
    background: linear-gradient(90deg,#0b8457,#065f46);
    color:white;
    padding:22px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    letter-spacing:1px;
}

.menu{
    background:#065f46;
    padding:12px;
    text-align:center;
}

.menu a{
    color:white;
    margin:15px;
    text-decoration:none;
    font-weight:bold;
    transition: 0.3s;
}

.menu a:hover{
    color:#a5f3fc;
}

.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    background:white;
    width:200px;
    margin:15px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 8px 18px rgba(0,0,0,0.2);
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 25px rgba(0,0,0,0.25);
}

.value{
    font-size:28px;
    color:#0b8457;
    margin-top:10px;
    font-weight:bold;
}

.section{
    background:white;
    margin:25px auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 18px rgba(0,0,0,0.2);
    text-align:center;
    max-width:900px;
}

.alert{
    background:#ffebee;
    color:#b91c1c;
    padding:18px;
    margin:20px auto;
    text-align:center;
    border-radius:12px;
    font-weight:bold;
    font-size:20px;
    max-width:600px;
    animation: flash 1.2s infinite;
}

@keyframes flash{
    0%{opacity:1;}
    50%{opacity:0.5;}
    100%{opacity:1;}
}

#charts{
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    margin-top:25px;
}

.chart-card{
    background:white;
    padding:20px;
    margin:15px;
    border-radius:15px;
    box-shadow:0 8px 18px rgba(0,0,0,0.2);
    width:400px;
}

img.drone{
    width:80%;
    border-radius:15px;
    margin-top:15px;
}

</style>
</head>

<body>

<header>
IoT Based Crop Health Monitoring
</header>

<div class="menu">
<a href="#">Home</a>
<a href="#">Drone Data</a>
<a href="#">Crop Health</a>
<a href="#">Alerts</a>
</div>

<!-- Dynamic Cards -->
<div class="container" id="cardContainer">
<!-- Cards will be injected here dynamically -->
</div>

<!-- Drone Section -->
<div class="section">
<h2>Drone Image Analysis</h2>
<img src="https://via.placeholder.com/700x350.png?text=Drone+Image" class="drone" alt="Drone Image">
<p>Healthy Crop Area: <b>80%</b></p>
<p>Affected Area: <b>20%</b></p>
</div>

<!-- Charts -->
<div id="charts">
<div class="chart-card">
<canvas id="tempChart"></canvas>
</div>
<div class="chart-card">
<canvas id="humidityChart"></canvas>
</div>
<div class="chart-card">
<canvas id="sugarChart"></canvas>
</div>
</div>

<div class="alert">
⚠ Disease detected in Section B – Immediate inspection needed
</div>

<script>
// ======= Dynamic Dashboard Cards =======
const parameters = [
    {name:'Field Status', value:'Healthy'},
    {name:'Temperature', value:'30°C'},
    {name:'Humidity', value:'68%'},
    {name:'Crop Health', value:'Good'},
    {name:'Sugar Level', value:'15 Brix'},  // NEW PARAMETER
    {name:'Soil Moisture', value:'45%'}    // NEW PARAMETER
];

const cardContainer = document.getElementById('cardContainer');
parameters.forEach(param=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML=`<h3>${param.name}</h3><div class="value">${param.value}</div>`;
    cardContainer.appendChild(card);
});

// ======= Charts =======
const tempCtx = document.getElementById('tempChart').getContext('2d');
new Chart(tempCtx,{
    type:'line',
    data:{
        labels:['9 AM','12 PM','3 PM','6 PM','9 PM'],
        datasets:[{
            label:'Temperature (°C)',
            data:[28,30,31,29,27],
            borderColor:'#0b8457',
            backgroundColor:'rgba(11,132,87,0.2)',
            tension:0.3
        }]
    },
    options:{responsive:true}
});

const humCtx = document.getElementById('humidityChart').getContext('2d');
new Chart(humCtx,{
    type:'line',
    data:{
        labels:['9 AM','12 PM','3 PM','6 PM','9 PM'],
        datasets:[{
            label:'Humidity (%)',
            data:[65,68,70,66,64],
            borderColor:'#065f46',
            backgroundColor:'rgba(6,95,70,0.2)',
            tension:0.3
        }]
    },
    options:{responsive:true}
});

const sugarCtx = document.getElementById('sugarChart').getContext('2d');
new Chart(sugarCtx,{
    type:'line',
    data:{
        labels:['9 AM','12 PM','3 PM','6 PM','9 PM'],
        datasets:[{
            label:'Sugar Level (Brix)',
            data:[14,15,15,16,15],
            borderColor:'#ff8c00',
            backgroundColor:'rgba(255,140,0,0.2)',
            tension:0.3
        }]
    },
    options:{responsive:true}
});
</script>

</body>
</html>
